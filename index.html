<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!--SEO_META-->
  <style>
    html body {
      background: #f8f8f8;
    }

    html[data-theme='dark'] body {
      background-color: #000;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: inherit;
      gap: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dots {

      0%,
      20% {
        content: ".";
      }

      40% {
        content: "..";
      }

      60%,
      100% {
        content: "...";
      }
    }

    #loading-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      color: #1f1f1f;
    }

    .avato-logo-wrapper {
      position: relative;
    }

    .avato-logo-img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: block;
      position: relative;
      z-index: 2;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .avato-spinner {
      position: absolute;
      inset: -12px;
      border-radius: 24px;
      border: 2px dashed currentColor;
      opacity: 0.25;
      animation: spin 6s linear infinite;
      z-index: 1;
    }

    .avato-text {
      font-family: ui-rounded, 'Hiragino Maru Gothic ProN', Quicksand, Comfortaa, 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }

    .avato-text::after {
      content: "";
      animation: dots 1.5s infinite;
      position: absolute;
    }

    html[data-theme='dark'] #loading-brand {
      color: #f0f0f0;
    }
  </style>
  <script>
    (function () {
      function supportsImportMaps() {
        return (
          typeof HTMLScriptElement !== 'undefined' &&
          typeof HTMLScriptElement.supports === 'function' &&
          HTMLScriptElement.supports('importmap')
        );
      }

      function supportsCascadeLayers() {
        var el = document.createElement('div');
        el.className = '__layer_test__';
        el.style.position = 'absolute';
        el.style.left = '-99999px';
        el.style.top = '-99999px';

        var style = document.createElement('style');
        style.textContent =
          '@layer a, b;' +
          '@layer a { .__layer_test__ { color: rgb(1, 2, 3); } }' +
          '@layer b { .__layer_test__ { color: rgb(4, 5, 6); } }';

        document.documentElement.append(style);
        document.documentElement.append(el);

        var color = getComputedStyle(el).color;

        el.remove();
        style.remove();

        return color === 'rgb(4, 5, 6)';
      }

      if (!(supportsImportMaps() && supportsCascadeLayers())) {
        window.location.href = '/not-compatible.html';
        return;
      }

      var theme = 'system';
      try {
        theme = localStorage.getItem('theme') || 'system';
      } catch (_) { }
      var systemTheme =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      var resolvedTheme = theme === 'system' ? systemTheme : theme;
      if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', resolvedTheme);
      }

      var hl = new URLSearchParams(location.search).get('hl');
      var m = document.cookie.match(/(?:^|;\s*)LOBE_LOCALE=([^;]*)/);
      var cookie = m ? decodeURIComponent(m[1]) : '';
      var locale = hl || cookie || navigator.language || 'en-US';
      if (locale === 'auto') locale = navigator.language || 'en-US';
      if (hl && !cookie) {
        document.cookie =
          'LOBE_LOCALE=' + encodeURIComponent(hl) + ';path=/;max-age=7776000;SameSite=Lax';
      }
      document.documentElement.lang = locale;
      var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
      document.documentElement.dir =
        rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
    })();
  </script>
  <script>
    window.__SERVER_CONFIG__ = undefined; /* SERVER_CONFIG */
  </script>
</head>

<body>
  <div id="loading-screen">
    <div id="loading-brand" aria-label="Loading" role="status">
      <div class="avato-logo-wrapper">
        <div class="avato-spinner"></div>
        <img alt="Avato" class="avato-logo-img" src="/icons/icon-192x192.png" />
      </div>
      <span class="avato-text">Avato</span>
    </div>
  </div>
  <div id="root" style="height: 100%"></div>

  <!--ANALYTICS_SCRIPTS-->
  <script type="module" src="/src/spa/entry.web.tsx"></script>
</body>

</html>
