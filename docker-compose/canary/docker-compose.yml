name: lobehub-canary
services:
  lobe:
    image: '${LOBE_IMAGE:-lobehub/lobehub}:${LOBE_IMAGE_TAG:-latest}'
    container_name: canary-lobe
    ports:
      - '${LOBE_PORT}:3210'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      - 'KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}'
      - 'AUTH_SECRET=${AUTH_SECRET}'
      - 'DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgresql:5432/${LOBE_DB_NAME}'
      - 'INTERNAL_APP_URL=http://localhost:3210'
      - 'S3_ENDPOINT=${S3_ENDPOINT}'
      - 'S3_BUCKET=${RUSTFS_LOBE_BUCKET}'
      - 'S3_ENABLE_PATH_STYLE=1'
      - 'S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}'
      - 'S3_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}'
      - 'S3_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}'
      - 'LLM_VISION_IMAGE_USE_BASE64=1'
      - 'S3_SET_ACL=0'
      - 'SEARXNG_URL=http://searxng:8080'
      - 'AGENT_RUNTIME_MODE=${AGENT_RUNTIME_MODE:-queue}'
      - 'REDIS_URL=redis://redis:6379'
      - 'REDIS_PREFIX=lobechat_canary'
      - 'REDIS_TLS=0'
      - 'S3_ENDPOINT=http://rustfs:9000'
      - 'VIRTUAL_HOST=canary.turingmesh.com'
      - 'VIRTUAL_PORT=3210'
    env_file:
      - .env
    restart: always
    networks:
      - canary-network
      - stack-network

  postgresql:
    image: paradedb/paradedb:latest-pg17
    container_name: canary-postgres
    ports:
      - '5433:5432'
    volumes:
      - './data:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_DB=${LOBE_DB_NAME}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - canary-network

  redis:
    image: redis:7-alpine
    container_name: canary-redis
    ports:
      - '6380:6379'
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - canary-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: canary-rustfs
    ports:
      - '${RUSTFS_PORT}:9000'
      - '${RUSTFS_ADMIN_PORT}:9001'
    environment:
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - 'rustfs-data:/data'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1' ]
      interval: 5s
      timeout: 3s
      retries: 30
    command: [ '--access-key', '${RUSTFS_ACCESS_KEY}', '--secret-key', '${RUSTFS_SECRET_KEY}', '/data' ]
    networks:
      - canary-network

  rustfs-init:
    image: minio/mc:latest
    container_name: canary-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./bucket.config.json:/bucket.config.json:ro
    entrypoint: /bin/sh
    command: -c ' set -eux; echo "S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}, S3_SECRET_KEY=${RUSTFS_SECRET_KEY}"; mc --version; mc alias set rustfs "http://rustfs:9000" "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}"; mc ls rustfs || true; mc mb "rustfs/lobe-canary" --ignore-existing; mc admin info rustfs || true; mc anonymous set-json "/bucket.config.json" "rustfs/lobe-canary"; '
    restart: 'no'
    networks:
      - canary-network

  searxng:
    image: searxng/searxng
    container_name: canary-searxng
    volumes:
      - './searxng-settings.yml:/etc/searxng/settings.yml'
    environment:
      - 'SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml'
    restart: always
    networks:
      - canary-network
    env_file:
      - .env

networks:
  canary-network:
    driver: bridge
  stack-network:
    external: true

volumes:
  redis_data:
    driver: local
  rustfs-data:
    driver: local
