<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avato</title>
  <style>
    :root {
      color-scheme: light;
      --loading-bg: #f4f1eb;
      --loading-beam: rgba(95, 177, 147, 0.08);
      --loading-beam-secondary: rgba(255, 255, 255, 0.72);
      --loading-grid: rgba(17, 23, 22, 0.045);
      --loading-text: rgba(17, 23, 22, 0.95);
      --loading-subtext: rgba(17, 23, 22, 0.54);
      --loading-logo-bg: rgba(255, 255, 252, 0.88);
      --loading-logo-border: rgba(17, 23, 22, 0.08);
      --loading-logo-shadow: rgba(17, 23, 22, 0.08);
      --loading-logo-filter: none;
      --loading-track: rgba(17, 23, 22, 0.12);
      --loading-accent: #5fb193;
      --loading-accent-soft: rgba(95, 177, 147, 0.18);
    }

    html[data-theme='dark'] {
      color-scheme: dark;
      --loading-bg: #090a0a;
      --loading-beam: rgba(118, 196, 165, 0.09);
      --loading-beam-secondary: rgba(255, 255, 255, 0.04);
      --loading-grid: rgba(255, 255, 255, 0.035);
      --loading-text: rgba(243, 247, 245, 0.96);
      --loading-subtext: rgba(243, 247, 245, 0.48);
      --loading-logo-bg: #000;
      --loading-logo-border: rgba(243, 247, 245, 0.08);
      --loading-logo-shadow: rgba(0, 0, 0, 0.36);
      --loading-logo-filter: brightness(0) invert(1);
      --loading-track: rgba(243, 247, 245, 0.12);
      --loading-accent: #76c4a5;
      --loading-accent-soft: rgba(118, 196, 165, 0.2);
    }

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;

      margin: 0;
      box-sizing: border-box;

      background: var(--loading-bg);
    }

    .drag-bar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 3;

      height: 48px;
      -webkit-app-region: drag;
    }

    .loading-screen {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100dvh;
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .loading-screen::before {
      content: '';

      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at 50% 14%, var(--loading-beam) 0%, transparent 34%),
        linear-gradient(180deg, var(--loading-beam-secondary) 0%, transparent 38%);
      pointer-events: none;
    }

    .loading-screen::after {
      content: '';

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(to right, var(--loading-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--loading-grid) 1px, transparent 1px);
      background-size: 52px 52px;
      opacity: 0.32;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(circle at center, black 26%, transparent 78%);
      mask-image: radial-gradient(circle at center, black 26%, transparent 78%);
    }

    .loading-brand {
      position: relative;
      z-index: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      color: var(--loading-text);
      font-family: 'Geist', 'SF Pro Display', 'Segoe UI Variable', 'Segoe UI', sans-serif;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .loading-logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
    }

    .loading-logo-core {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 76px;
      height: 76px;
      border: 1px solid var(--loading-logo-border);
      border-radius: 28px;

      background: var(--loading-logo-bg);
      box-shadow: 0 16px 32px -26px var(--loading-logo-shadow);
    }

    .loading-logo-core img {
      display: block;

      width: 56px;
      height: 56px;

      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      backface-visibility: hidden;
      filter: var(--loading-logo-filter);
      transform: translateZ(0);
    }

    .loading-headline {
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .loading-subtext {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--loading-subtext);
    }

    .loading-subtext::before {
      content: '';

      width: 6px;
      height: 6px;
      border-radius: 999px;

      background: var(--loading-accent);
      box-shadow: 0 0 0 4px var(--loading-accent-soft);
    }

    .loading-subtext::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }

    .loading-bar {
      position: relative;

      overflow: hidden;

      width: 168px;
      height: 2px;
      border-radius: 999px;

      background: var(--loading-track);
    }

    .loading-bar::after {
      position: absolute;
      inset: 0 auto 0 0;

      width: 38%;
      border-radius: inherit;

      background: linear-gradient(90deg,
          transparent 0%,
          var(--loading-accent) 28%,
          transparent 100%);
      content: '';
      transform: translateX(-100%);

      animation: track 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes track {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(220%);
      }
    }

    @keyframes dots {

      0%,
      20% {
        content: '.';
      }

      40% {
        content: '..';
      }

      60%,
      100% {
        content: '...';
      }
    }

    @media (max-width: 640px) {
      .loading-logo-core {
        width: 72px;
        height: 72px;
      }

      .loading-logo-core img {
        width: 52px;
        height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .loading-bar::after,
      .loading-subtext::before,
      .loading-subtext::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <script>
    (function () {
      var theme = 'system';
      try {
        theme = localStorage.getItem('theme') || 'system';
      } catch (_) { }
      var systemTheme =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      var resolvedTheme = theme === 'system' ? systemTheme : theme;

      document.documentElement.setAttribute('data-theme', resolvedTheme);

      var locale = navigator.language || 'en-US';
      try {
        locale =
          localStorage.getItem('LOBE_LOCALE') ||
          localStorage.getItem('i18nextLng') ||
          navigator.language ||
          'en-US';
      } catch (_) { }
      if (locale === 'auto') locale = navigator.language || 'en-US';
      document.documentElement.lang = locale;

      var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
      document.documentElement.dir =
        rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';

      var loadingLabels = {
        'ar': 'جارٍ التحميل',
        'bg': 'Зареждане',
        'bg-bg': 'Зареждане',
        'de': 'Wird geladen',
        'de-de': 'Wird geladen',
        'en': 'Loading',
        'en-us': 'Loading',
        'es': 'Cargando',
        'es-es': 'Cargando',
        'fa': 'در حال بارگذاری',
        'fa-ir': 'در حال بارگذاری',
        'fr': 'Chargement',
        'fr-fr': 'Chargement',
        'it': 'Caricamento',
        'it-it': 'Caricamento',
        'ja': '読み込み中',
        'ja-jp': '読み込み中',
        'ko': '로딩 중',
        'ko-kr': '로딩 중',
        'nl': 'Laden',
        'nl-nl': 'Laden',
        'pl': 'Ładowanie',
        'pl-pl': 'Ładowanie',
        'pt': 'Carregando',
        'pt-br': 'Carregando',
        'ru': 'Загрузка',
        'ru-ru': 'Загрузка',
        'tr': 'Yükleniyor',
        'tr-tr': 'Yükleniyor',
        'vi': 'Đang tải',
        'vi-vn': 'Đang tải',
        'zh': '加载中',
        'zh-cn': '加载中',
        'zh-tw': '載入中',
      };

      var normalizedLocale = locale.toLowerCase();
      var shortLocale = normalizedLocale.split('-')[0];
      window.__LOADING_LABEL__ =
        loadingLabels[normalizedLocale] || loadingLabels[shortLocale] || loadingLabels.en;
    })();
  </script>

  <div class="drag-bar"></div>
  <div class="loading-screen">
    <div class="loading-brand" aria-label="Loading" aria-live="polite" role="status">
      <div class="loading-logo-wrap">
        <div class="loading-logo-core">
          <img alt="Avato" decoding="async" draggable="false" height="56" fetchpriority="high"
            src="./avato-logo-512.png" width="56" />
        </div>
      </div>
      <div class="loading-headline">Avato</div>
      <div class="loading-subtext"><span id="loading-label">Loading</span></div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    (function () {
      var loadingLabel = window.__LOADING_LABEL__ || 'Loading';
      var loadingBrand = document.querySelector('.loading-brand');
      var loadingLabelNode = document.getElementById('loading-label');

      if (loadingBrand) {
        loadingBrand.setAttribute('aria-label', loadingLabel);
      }

      if (loadingLabelNode) {
        loadingLabelNode.textContent = loadingLabel;
      }
    })();
  </script>
</body>

</html>
